services:
  - type: web
    name: electromecanica-mauro
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_DIR
        value: /tmp/electromecanica-mauro/data
      - key: UPLOAD_DIR
        value: /tmp/electromecanica-mauro/uploads
      - key: COOKIE_SECURE
        value: "true"
